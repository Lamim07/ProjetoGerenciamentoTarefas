L</text><text x="780" y="322" class="campo">descricao</text><text x="997" y="322" class="rotulo">NVARCHAR(MAX)</text><text x="1175" y="322" class="rotulo">NOT NULL</text><text x="780" y="371" class="campo">criador_id</text><text x="997" y="371" class="rotulo">BIGINT</text><text x="1175" y="371" class="rotulo">FK → usuarios</text><text x="780" y="420" class="campo">responsavel_id</text><text x="997" y="420" class="rotulo">BIGINT</text><text x="1175" y="420" class="rotulo">FK → usuarios</text><text x="780" y="469" class="campo">categoria_id</text><text x="997" y="469" class="rotulo">BIGINT</text><text x="1175" y="469" class="rotulo">FK → categorias</text><text x="780" y="518" class="campo">prazo</text><text x="997" y="518" class="rotulo">DATE</text><text x="1175" y="518" class="rotulo">NOT NULL</text><text x="780" y="567" class="campo">prioridade</text><text x="997" y="567" class="rotulo">NVARCHAR(10)</text><text x="1175" y="567" class="rotulo">CHECK</text><text x="780" y="616" class="campo">status</text><text x="997" y="616" class="rotulo">NVARCHAR(20)</text><text x="1175" y="616" class="rotulo">CHECK</text><text x="780" y="665" class="campo">criada_em</text><text x="997" y="665" class="rotulo">DATETIME2(0)</text><text x="1175" y="665" class="rotulo">NOT NULL</text><rect x="760" y="865" width="590" height="280" rx="9" fill="white" stroke="#7c8da6" stroke-width="2"/><path d="M769,865 H1341 Q1350,865 1350,874 V926 H760 V874 Q760,865 769,865" fill="#dce8ff"/><text x="782" y="905" class="nome">COMENTARIOS_TAREFA</text><line x1="760" y1="926" x2="1350" y2="926" class="linha"/><text x="780" y="959" class="campo">id</text><text x="997" y="959" class="rotulo">BIGINT</text><text x="1175" y="959" class="rotulo">PK</text><text x="780" y="997" class="campo">tarefa_id</text><text x="997" y="997" class="rotulo">BIGINT</text><text x="1175" y="997" class="rotulo">FK → tarefas</text><text x="780" y="1035" class="campo">autor_id</text><text x="997" y="1035" class="rotulo">BIGINT</text><text x="1175" y="1035" class="rotulo">FK → usuarios</text><text x="780" y="1073" class="campo">conteudo</text><text x="997" y="1073" class="rotulo">NVARCHAR(2000)</text><text x="1175" y="1073" class="rotulo">NOT NULL</text><text x="780" y="1111" class="campo">criado_em</text><text x="997" y="1111" class="rotulo">DATETIME2(0)</text><text x="1175" y="1111" class="rotulo">NOT NULL</text><text x="1410" y="185" class="nome">Regras do modelo</text><text x="1410" y="232" class="campo">• categoria_id obrigatório</text><text x="1410" y="266" class="campo">• uma categoria em várias tarefas</text><text x="1410" y="300" class="campo">• comentários pertencem à tarefa</text><text x="1410" y="334" class="campo">• autor é um usuário</text><text x="1410" y="383" class="campo">Status: PENDENTE,</text><text x="1410" y="413" class="campo">EM_ANDAMENTO, CONCLUIDA</text><text x="1410" y="462" class="campo">Prioridade: BAIXA, MEDIA, ALTA</text><text x="1410" y="515" class="campo">Geral: categoria inicial</text><text x="1410" y="549" class="campo">para tarefas já existentes</text></svg>