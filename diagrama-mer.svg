<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950">
  <defs>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#203047}
      .title{font-size:30px;font-weight:700}
      .name{font-size:24px;font-weight:700}
      .head{font-size:16px;font-weight:700;fill:#52647d}
      .body{font-size:18px}
      .small{font-size:15px;fill:#52647d}
      .line{stroke:#566782;stroke-width:2.5;fill:none}
      .box{fill:white;stroke:#7c8da6;stroke-width:2}
    </style>
  </defs>
  <rect width="1500" height="950" fill="#eef2f8"/>
  <text x="65" y="65" class="title">Modelo Entidade-Relacionamento — Gerenciamento de Tarefas</text>
  <text x="65" y="95" class="small">Modelo lógico para SQL Server • duas relações independentes entre usuários e tarefas</text>

  <!-- Relationship lines: crow's foot at TAREFAS -->
  <path class="line" d="M660 336 H795"/>
  <path class="line" d="M660 460 H795"/>
  <path class="line" d="M680 322 V350 M680 446 V474"/>
  <path class="line" d="M770 322 L795 336 L770 350 M770 446 L795 460 L770 474"/>
  <circle cx="754" cy="336" r="6" fill="white" stroke="#566782" stroke-width="2"/>
  <circle cx="754" cy="460" r="6" fill="white" stroke="#566782" stroke-width="2"/>
  <text x="698" y="307" class="small">cria</text>
  <text x="681" y="435" class="small">recebe</text>

  <!-- USUARIOS -->
  <rect x="65" y="185" width="595" height="365" rx="9" class="box"/>
  <rect x="65" y="185" width="595" height="62" rx="9" fill="#dce8ff"/>
  <text x="92" y="225" class="name">USUARIOS</text>
  <line x1="65" y1="247" x2="660" y2="247" class="line"/>
  <text x="92" y="279" class="head">CAMPO</text>
  <text x="370" y="279" class="head">TIPO</text>
  <text x="540" y="279" class="head">RESTRIÇÃO</text>
  <line x1="65" y1="292" x2="660" y2="292" stroke="#dce3ed"/>
  <text x="92" y="324" class="body">id</text><text x="370" y="324" class="body">BIGINT</text><text x="540" y="324" class="body">PK</text>
  <text x="92" y="365" class="body">nome</text><text x="370" y="365" class="body">NVARCHAR</text><text x="540" y="365" class="body">NOT NULL</text>
  <text x="92" y="406" class="body">nome_usuario</text><text x="370" y="406" class="body">NVARCHAR</text><text x="540" y="406" class="body">UNIQUE</text>
  <text x="92" y="447" class="body">email</text><text x="370" y="447" class="body">NVARCHAR</text><text x="540" y="447" class="body">UNIQUE</text>
  <text x="92" y="488" class="body">senha_hash</text><text x="370" y="488" class="body">NVARCHAR</text><text x="540" y="488" class="body">NOT NULL</text>

  <!-- TAREFAS -->
  <rect x="795" y="165" width="640" height="590" rx="9" class="box"/>
  <rect x="795" y="165" width="640" height="62" rx="9" fill="#dce8ff"/>
  <text x="822" y="205" class="name">TAREFAS</text>
  <line x1="795" y1="227" x2="1435" y2="227" class="line"/>
  <text x="822" y="259" class="head">CAMPO</text>
  <text x="1106" y="259" class="head">TIPO</text>
  <text x="1268" y="259" class="head">RESTRIÇÃO</text>
  <line x1="795" y1="272" x2="1435" y2="272" stroke="#dce3ed"/>
  <text x="822" y="304" class="body">id</text><text x="1106" y="304" class="body">BIGINT</text><text x="1268" y="304" class="body">PK</text>
  <text x="822" y="345" class="body">criador_id</text><text x="1106" y="345" class="body">BIGINT</text><text x="1268" y="345" class="body">FK → usuarios.id</text>
  <text x="822" y="386" class="body">responsavel_id</text><text x="1106" y="386" class="body">BIGINT</text><text x="1268" y="386" class="body">FK → usuarios.id</text>
  <text x="822" y="427" class="body">titulo</text><text x="1106" y="427" class="body">NVARCHAR</text><text x="1268" y="427" class="body">NOT NULL</text>
  <text x="822" y="468" class="body">descricao</text><text x="1106" y="468" class="body">NVARCHAR</text><text x="1268" y="468" class="body">NOT NULL</text>
  <text x="822" y="509" class="body">prazo</text><text x="1106" y="509" class="body">DATE</text><text x="1268" y="509" class="body">NOT NULL</text>
  <text x="822" y="550" class="body">prioridade</text><text x="1106" y="550" class="body">NVARCHAR</text><text x="1268" y="550" class="body">CHECK</text>
  <text x="822" y="591" class="body">status</text><text x="1106" y="591" class="body">NVARCHAR</text><text x="1268" y="591" class="body">CHECK</text>
  <text x="822" y="632" class="body">criada_em</text><text x="1106" y="632" class="body">DATETIME2</text><text x="1268" y="632" class="body">NOT NULL</text>
  <line x1="795" y1="661" x2="1435" y2="661" stroke="#dce3ed"/>
  <text x="822" y="695" class="small">prioridade: BAIXA, MEDIA, ALTA</text>
  <text x="822" y="724" class="small">status: PENDENTE, EM_ANDAMENTO, CONCLUIDA</text>

  <rect x="65" y="800" width="1370" height="95" rx="10" fill="#fff" stroke="#d6dfeb"/>
  <text x="91" y="837" class="body">Cardinalidades: 1 usuário cria 0..N tarefas; 1 usuário recebe 0..N tarefas.</text>
  <text x="91" y="870" class="small">Cada tarefa exige exatamente 1 criador e 1 responsável. Prazo usa DATE; criação usa DATETIME2(0) no SQL Server.</text>
</svg>
